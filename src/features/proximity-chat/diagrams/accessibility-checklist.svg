<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="800" viewBox="0 0 1000 800">
  <style>
    .title { font: bold 24px sans-serif; fill: #333; }
    .subtitle { font: 16px sans-serif; fill: #666; }
    .section-title { font: bold 18px sans-serif; fill: #333; }
    .section-desc { font: 14px sans-serif; fill: #666; }
    .check-item { font: 14px sans-serif; fill: #333; }
    .check-complete { fill: #4caf50; }
    .check-incomplete { fill: #f44336; }
    .category { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; rx: 8; ry: 8; }
    .category-title { font: bold 16px sans-serif; fill: #333; }
    .progress-bg { fill: #e0e0e0; rx: 5; ry: 5; }
    .progress-fill { fill: #4caf50; rx: 5; ry: 5; }
    .progress-text { font: bold 14px sans-serif; fill: #333; }
    .wcag-badge { fill: #3949ab; rx: 12; ry: 12; }
    .wcag-text { font: bold 12px sans-serif; fill: white; }
  </style>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" class="title">Proximity Chat Accessibility Compliance</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">Implementation Checklist and Progress Status</text>
  
  <!-- Overall Progress -->
  <rect x="350" y="100" width="300" height="30" class="progress-bg" />
  <rect x="350" y="100" width="270" height="30" class="progress-fill" />
  <text x="500" y="122" text-anchor="middle" class="progress-text">90% Complete</text>
  
  <!-- Keyboard Navigation Category -->
  <rect x="50" y="160" width="400" height="240" class="category" />
  <text x="250" y="190" text-anchor="middle" class="category-title">Keyboard Navigation</text>
  
  <g transform="translate(70, 210)">
    <circle cx="10" cy="10" r="10" class="check-complete" />
    <text x="30" y="15" class="check-item">Focus management system</text>
    <circle cx="10" cy="40" r="10" class="check-complete" />
    <text x="30" y="45" class="check-item">Keyboard shortcuts (Alt+1-4)</text>
    <circle cx="10" cy="70" r="10" class="check-complete" />
    <text x="30" y="75" class="check-item">Skip links for navigation</text>
    <circle cx="10" cy="100" r="10" class="check-complete" />
    <text x="30" y="105" class="check-item">Focus trap in dialogs</text>
    <circle cx="10" cy="130" r="10" class="check-complete" />
    <text x="30" y="135" class="check-item">Visible focus indicators</text>
    <circle cx="10" cy="160" r="10" class="check-complete" />
    <text x="30" y="165" class="check-item">Arrow key navigation in lists</text>
    <rect x="250" y="0" width="60" height="24" class="wcag-badge" />
    <text x="280" y="17" text-anchor="middle" class="wcag-text">2.1.1</text>
    <rect x="250" y="70" width="60" height="24" class="wcag-badge" />
    <text x="280" y="87" text-anchor="middle" class="wcag-text">2.4.1</text>
    <rect x="250" y="130" width="60" height="24" class="wcag-badge" />
    <text x="280" y="147" text-anchor="middle" class="wcag-text">2.4.7</text>
  </g>
  
  <!-- Screen Reader Support Category -->
  <rect x="50" y="420" width="400" height="240" class="category" />
  <text x="250" y="450" text-anchor="middle" class="category-title">Screen Reader Support</text>
  
  <g transform="translate(70, 470)">
    <circle cx="10" cy="10" r="10" class="check-complete" />
    <text x="30" y="15" class="check-item">ARIA landmarks and roles</text>
    <circle cx="10" cy="40" r="10" class="check-complete" />
    <text x="30" y="45" class="check-item">Live regions for announcements</text>
    <circle cx="10" cy="70" r="10" class="check-complete" />
    <text x="30" y="75" class="check-item">Descriptive element labels</text>
    <circle cx="10" cy="100" r="10" class="check-complete" />
    <text x="30" y="105" class="check-item">Image alternatives</text>
    <circle cx="10" cy="130" r="10" class="check-complete" />
    <text x="30" y="135" class="check-item">Status announcements</text>
    <circle cx="10" cy="160" r="10" class="check-complete" />
    <text x="30" y="165" class="check-item">Context information</text>
    <rect x="250" y="0" width="60" height="24" class="wcag-badge" />
    <text x="280" y="17" text-anchor="middle" class="wcag-text">4.1.2</text>
    <rect x="250" y="40" width="60" height="24" class="wcag-badge" />
    <text x="280" y="57" text-anchor="middle" class="wcag-text">4.1.3</text>
    <rect x="250" y="100" width="60" height="24" class="wcag-badge" />
    <text x="280" y="117" text-anchor="middle" class="wcag-text">1.1.1</text>
  </g>
  
  <!-- Visual Presentation Category -->
  <rect x="550" y="160" width="400" height="240" class="category" />
  <text x="750" y="190" text-anchor="middle" class="category-title">Visual Presentation</text>
  
  <g transform="translate(570, 210)">
    <circle cx="10" cy="10" r="10" class="check-complete" />
    <text x="30" y="15" class="check-item">Color contrast (4.5:1 ratio)</text>
    <circle cx="10" cy="40" r="10" class="check-complete" />
    <text x="30" y="45" class="check-item">Text resizing up to 200%</text>
    <circle cx="10" cy="70" r="10" class="check-complete" />
    <text x="30" y="75" class="check-item">Color not sole indicator</text>
    <circle cx="10" cy="100" r="10" class="check-complete" />
    <text x="30" y="105" class="check-item">High contrast mode support</text>
    <circle cx="10" cy="130" r="10" class="check-complete" />
    <text x="30" y="135" class="check-item">Responsive design patterns</text>
    <circle cx="10" cy="160" r="10" class="check-complete" />
    <text x="30" y="165" class="check-item">Dark mode support</text>
    <rect x="250" y="0" width="60" height="24" class="wcag-badge" />
    <text x="280" y="17" text-anchor="middle" class="wcag-text">1.4.3</text>
    <rect x="250" y="40" width="60" height="24" class="wcag-badge" />
    <text x="280" y="57" text-anchor="middle" class="wcag-text">1.4.4</text>
    <rect x="250" y="70" width="60" height="24" class="wcag-badge" />
    <text x="280" y="87" text-anchor="middle" class="wcag-text">1.4.1</text>
  </g>
  
  <!-- Interaction Support Category -->
  <rect x="550" y="420" width="400" height="240" class="category" />
  <text x="750" y="450" text-anchor="middle" class="category-title">Interaction Support</text>
  
  <g transform="translate(570, 470)">
    <circle cx="10" cy="10" r="10" class="check-complete" />
    <text x="30" y="15" class="check-item">Error identification</text>
    <circle cx="10" cy="40" r="10" class="check-complete" />
    <text x="30" y="45" class="check-item">Focus management on dynamic content</text>
    <circle cx="10" cy="70" r="10" class="check-complete" />
    <text x="30" y="75" class="check-item">Multiple ways to navigate</text>
    <circle cx="10" cy="100" r="10" class="check-complete" />
    <text x="30" y="105" class="check-item">Consistent navigation patterns</text>
    <circle cx="10" cy="130" r="10" class="check-complete" />
    <text x="30" y="135" class="check-item">Help and documentation</text>
    <circle cx="10" cy="160" r="10" class="check-incomplete" />
    <text x="30" y="165" class="check-item">User testing with assistive tech</text>
    <rect x="250" y="0" width="60" height="24" class="wcag-badge" />
    <text x="280" y="17" text-anchor="middle" class="wcag-text">3.3.1</text>
    <rect x="250" y="70" width="60" height="24" class="wcag-badge" />
    <text x="280" y="87" text-anchor="middle" class="wcag-text">2.4.5</text>
    <rect x="250" y="100" width="60" height="24" class="wcag-badge" />
    <text x="280" y="117" text-anchor="middle" class="wcag-text">3.2.3</text>
  </g>
  
  <!-- Category Progress Bars -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="400" height="10" class="progress-bg" />
    <rect x="0" y="0" width="400" height="10" class="progress-fill" />
    <text x="380" y="-5" text-anchor="end" class="progress-text">100%</text>
  </g>
  
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="400" height="10" class="progress-bg" />
    <rect x="0" y="0" width="400" height="10" class="progress-fill" />
    <text x="380" y="-5" text-anchor="end" class="progress-text">100%</text>
  </g>
  
  <g transform="translate(550, 400)">
    <rect x="0" y="0" width="400" height="10" class="progress-bg" />
    <rect x="0" y="0" width="400" height="10" class="progress-fill" />
    <text x="380" y="-5" text-anchor="end" class="progress-text">100%</text>
  </g>
  
  <g transform="translate(550, 660)">
    <rect x="0" y="0" width="400" height="10" class="progress-bg" />
    <rect x="0" y="0" width="335" height="10" class="progress-fill" />
    <text x="380" y="-5" text-anchor="end" class="progress-text">83%</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(400, 700)">
    <circle cx="10" cy="10" r="10" class="check-complete" />
    <text x="30" y="15" class="check-item">Implemented</text>
    
    <circle cx="150" cy="10" r="10" class="check-incomplete" />
    <text x="170" y="15" class="check-item">Planned/In Progress</text>
    
    <rect x="300" y="0" width="60" height="24" class="wcag-badge" />
    <text x="330" y="17" text-anchor="middle" class="wcag-text">1.1.1</text>
    <text x="400" y="15" class="check-item">WCAG Success Criterion</text>
  </g>
  
  <!-- Note -->
  <text x="500" y="750" text-anchor="middle" class="section-desc">
    Based on WCAG 2.1 AA conformance level requirements and additional best practices
  </text>
  <text x="500" y="780" text-anchor="middle" class="section-desc">
    Next steps: Complete user testing with screen readers and add remaining features
  </text>
</svg> 