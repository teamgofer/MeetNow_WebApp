<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proximity Chat Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Load React -->
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Load Babel for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Load our components -->
  <script type="text/babel" src="../constants.js"></script>
  <script type="text/babel" src="../../utils/EventEmitter.js"></script>
  <script type="text/babel" src="../services/WebSocketService.js"></script>
  <script type="text/babel" src="../services/locationService.js"></script>
  <script type="text/babel" src="../services/MessageService.js"></script>
  <script type="text/babel" src="../services/ProximityChatService.js"></script>
  <script type="text/babel" src="./TestPage.jsx"></script>
  <script type="text/babel" src="./App.jsx"></script>
  
  <!-- Initialize the app -->
  <script type="text/babel">
    ReactDOM.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>,
      document.getElementById('root')
    );
  </script>
</body>
</html>
